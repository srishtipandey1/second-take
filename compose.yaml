services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  app:
    build: .
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECOND_TAKE_OLLAMA_URL: http://ollama:11434/api/generate
      SECOND_TAKE_DATA_DIR: /data
    volumes:
      - take-data:/data
      - whisper-cache:/root/.cache/huggingface

volumes:
  ollama-data:
  take-data:
  whisper-cache: